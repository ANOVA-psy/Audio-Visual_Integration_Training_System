<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音频播放测试 - 视听语音整合训练系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-size: 17px; }
    .log-area { height: 300px; overflow-y: auto; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h1 class="text-2xl font-bold text-gray-800 mb-6">🔊 音频播放测试</h1>
      
      <div class="mb-6 p-4 bg-blue-50 rounded-xl">
        <div class="font-bold text-blue-800 mb-2">测试说明</div>
        <div class="text-sm text-blue-600">
          此页面用于测试音频播放功能，帮助定位"只有噪音没有任务音频"的问题。
          请打开浏览器控制台（F12）查看详细日志。
        </div>
      </div>

      <div class="space-y-4 mb-8">
        <div class="p-4 bg-gray-50 rounded-xl">
          <div class="font-bold text-gray-700 mb-2">测试1：直接播放音频文件</div>
          <div class="text-sm text-gray-500 mb-3">测试音频文件是否能正常播放（不混合噪音）</div>
          <button onclick="testDirectAudio()" class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
            ▶️ 测试播放音频
          </button>
          <div class="mt-2 text-sm text-gray-500" id="test1Status">等待测试...</div>
        </div>

        <div class="p-4 bg-gray-50 rounded-xl">
          <div class="font-bold text-gray-700 mb-2">测试2：播放噪音</div>
          <div class="text-sm text-gray-500 mb-3">测试噪音是否能正常生成和播放</div>
          <button onclick="testNoise()" class="px-6 py-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600">
            ▶️ 测试播放噪音
          </button>
          <button onclick="stopNoise()" class="px-6 py-3 bg-gray-500 text-white rounded-lg hover:bg-gray-600">
            ⏹️ 停止噪音
          </button>
          <div class="mt-2 text-sm text-gray-500" id="test2Status">等待测试...</div>
        </div>

        <div class="p-4 bg-gray-50 rounded-xl">
          <div class="font-bold text-gray-700 mb-2">测试3：混合播放（噪音 + 任务音频）</div>
          <div class="text-sm text-gray-500 mb-3">测试完整的混合播放流程</div>
          <div class="mb-3">
            <label class="text-sm text-gray-600">SNR (dB): </label>
            <input type="range" id="testSnr" min="-12" max="6" step="3" value="0" class="w-full mt-1">
            <div class="text-center text-sm text-gray-500" id="testSnrValue">SNR: 0 dB</div>
          </div>
          <button onclick="testMixedAudio()" class="px-6 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600">
            ▶️ 测试混合播放
          </button>
          <div class="mt-2 text-sm text-gray-500" id="test3Status">等待测试...</div>
        </div>
      </div>

      <div class="mb-4">
        <div class="font-bold text-gray-700 mb-2">日志输出：</div>
        <div class="bg-gray-900 text-green-400 p-4 rounded-xl log-area font-mono text-sm" id="logOutput"></div>
      </div>

      <div class="text-center">
        <a href="视听语音整合训练系统_v3/index.html" class="text-sm text-gray-400 hover:text-gray-600 underline">
          ← 返回主系统
        </a>
      </div>
    </div>
  </div>

  <script>
    // 日志输出
    function log(msg) {
      const logOutput = document.getElementById('logOutput');
      const time = new Date().toLocaleTimeString();
      logOutput.innerHTML += `[${time}] ${msg}\n`;
      logOutput.scrollTop = logOutput.scrollHeight;
      console.log(msg);
    }

    // 更新状态
    function updateStatus(elementId, msg, isError = false) {
      const el = document.getElementById(elementId);
      if (el) {
        el.textContent = msg;
        el.className = `mt-2 text-sm ${isError ? 'text-red-500' : 'text-green-500'}`;
      }
    }

    // SNR滑块显示
    const testSnr = document.getElementById('testSnr');
    const testSnrValue = document.getElementById('testSnrValue');
    if (testSnr && testSnrValue) {
      testSnr.addEventListener('input', function() {
        testSnrValue.textContent = `SNR: ${this.value} dB`;
      });
    }

    // 测试1：直接播放音频文件
    async function testDirectAudio() {
      log('=== 测试1：直接播放音频文件 ===');
      updateStatus('test1Status', '正在测试...');
      
      try {
        const audioPath = 'assets/audio/M8_ba_A.mp4';
        log(`尝试播放音频: ${audioPath}`);
        
        const audio = document.createElement('audio');
        audio.src = audioPath;
        audio.volume = 1.0;
        
        audio.oncanplaythrough = function() {
          log('音频已加载，开始播放...');
          audio.play().then(() => {
            log('播放成功！等待播放结束...');
            updateStatus('test1Status', '播放中...');
          }).catch(err => {
            log(`播放失败: ${err.message}`);
            updateStatus('test1Status', '播放失败: ' + err.message, true);
          });
        };
        
        audio.onended = function() {
          log('音频播放结束！');
          updateStatus('test1Status', '播放成功！');
        };
        
        audio.onerror = function(e) {
          log(`音频加载失败: ${e}`);
          updateStatus('test1Status', '加载失败，请检查文件路径', true);
        };
        
        audio.load();
      } catch (error) {
        log(`测试失败: ${error.message}`);
        updateStatus('test1Status', '测试失败: ' + error.message, true);
      }
    }

    // 测试2：播放噪音
    let audioContext = null;
    let noiseSource = null;
    
    async function testNoise() {
      log('=== 测试2：播放噪音 ===');
      updateStatus('test2Status', '正在生成噪音...');
      
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
        
        log('生成合成噪音...');
        const sampleRate = audioContext.sampleRate;
        const length = sampleRate * 4; // 4秒
        const buffer = audioContext.createBuffer(1, length, sampleRate);
        const data = buffer.getChannelData(0);
        
        // 生成粉红噪音
        let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
        for (let i = 0; i < length; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
          b6 = white * 0.115926;
        }
        
        noiseSource = audioContext.createBufferSource();
        noiseSource.buffer = buffer;
        noiseSource.loop = true;
        
        const gainNode = audioContext.createGain();
        gainNode.gain.value = 0.5;
        noiseSource.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        noiseSource.start();
        log('噪音开始播放...');
        updateStatus('test2Status', '噪音播放中...点击"停止噪音"结束');
      } catch (error) {
        log(`噪音生成失败: ${error.message}`);
        updateStatus('test2Status', '噪音生成失败: ' + error.message, true);
      }
    }
    
    function stopNoise() {
      if (noiseSource) {
        try {
          noiseSource.stop();
          noiseSource.disconnect();
          noiseSource = null;
          log('噪音已停止');
          updateStatus('test2Status', '噪音已停止');
        } catch (e) {
          log(`停止噪音失败: ${e.message}`);
        }
      }
    }

    // 测试3：混合播放
    async function testMixedAudio() {
      log('=== 测试3：混合播放（噪音 + 任务音频）===');
      updateStatus('test3Status', '正在测试混合播放...');
      
      try {
        const snr = parseInt(document.getElementById('testSnr').value);
        log(`SNR设置为: ${snr} dB`);
        
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
        
        // 启动噪音
        log('启动噪音...');
        const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 4, audioContext.sampleRate);
        const noiseData = noiseBuffer.getChannelData(0);
        for (let i = 0; i < noiseData.length; i++) {
          noiseData[i] = (Math.random() * 2 - 1) * 0.5;
        }
        
        const noise = audioContext.createBufferSource();
        noise.buffer = noiseBuffer;
        noise.loop = true;
        
        const noiseGain = audioContext.createGain();
        const signalGainValue = 0.5;
        const noiseGainValue = signalGainValue * Math.pow(10, -snr / 20);
        noiseGain.gain.setValueAtTime(noiseGainValue, audioContext.currentTime);
        
        noise.connect(noiseGain);
        noiseGain.connect(audioContext.destination);
        noise.start();
        log(`噪音已启动，增益: ${noiseGainValue.toFixed(4)}`);
        
        // 播放任务音频
        log('播放任务音频...');
        const audioPath = 'assets/audio/M8_ba_A.mp4';
        const audioElement = document.createElement('audio');
        audioElement.src = audioPath;
        audioElement.volume = 1.0;
        
        const sourceNode = audioContext.createMediaElementSource(audioElement);
        const sigGain = audioContext.createGain();
        sigGain.gain.value = signalGainValue;
        sourceNode.connect(sigGain);
        sigGain.connect(audioContext.destination);
        
        await new Promise((resolve, reject) => {
          audioElement.oncanplaythrough = function() {
            log('任务音频已加载，开始播放...');
            audioElement.play().then(() => {
              log('任务音频播放中...');
            }).catch(err => {
              log(`任务音频播放失败: ${err.message}`);
              reject(err);
            });
          };
          
          audioElement.onended = function() {
            log('任务音频播放结束！');
            resolve();
          };
          
          audioElement.onerror = function(e) {
            log(`任务音频加载失败`);
            reject(new Error('音频加载失败'));
          };
          
          audioElement.load();
        });
        
        // 停止噪音
        log('任务音频播放完毕，停止噪音...');
        noise.stop();
        noise.disconnect();
        
        updateStatus('test3Status', '混合播放测试成功！');
      } catch (error) {
        log(`混合播放测试失败: ${error.message}`);
        updateStatus('test3Status', '测试失败: ' + error.message, true);
      }
    }

    log('音频测试页面已加载');
    log('请依次测试三个功能，查看哪个步骤失败');
  </script>
</body>
</html>
