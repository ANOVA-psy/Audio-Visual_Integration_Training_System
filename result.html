<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>结果分析 - 视听语音整合训练系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { font-size: 17px; }
    .screen { display:block; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

<div class="container mx-auto px-4 py-6 max-w-6xl">
  <div class="bg-white rounded-2xl shadow-xl p-8">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold text-gray-800">📊 结果分析</h2>
      <div class="flex gap-3">
        <button onclick="goBack()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 text-sm">← 返回</button>
        <button onclick="printResult()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-sm">🖨️ 打印</button>
      </div>
    </div>

    <!-- 结果摘要 -->
    <div id="resultSummary" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-blue-50 p-4 rounded-xl text-center">
        <div class="text-sm text-gray-500">被试编号</div>
        <div id="resSubject" class="text-xl font-bold text-blue-600">--</div>
      </div>
      <div class="bg-green-50 p-4 rounded-xl text-center">
        <div class="text-sm text-gray-500">正确率</div>
        <div id="rAcc" class="text-xl font-bold text-green-600">--%</div>
      </div>
      <div class="bg-purple-50 p-4 rounded-xl text-center">
        <div class="text-sm text-gray-500">平均反应时</div>
        <div id="rRT" class="text-xl font-bold text-purple-600">--ms</div>
      </div>
      <div class="bg-orange-50 p-4 rounded-xl text-center">
        <div class="text-sm text-gray-500">试次总数</div>
        <div id="rTotal" class="text-xl font-bold text-orange-600">--</div>
      </div>
    </div>

    <!-- 子标题 -->
    <div id="resSubtitle" class="text-center text-gray-500 mb-6"></div>

    <!-- 鼓励语 -->
    <div id="encourageMsg" class="mb-8 p-4 bg-blue-50 rounded-xl text-center">
      <div class="text-lg"></div>
    </div>

    <!-- 阈值结果 -->
    <div id="thresholdContainer" class="mb-8 p-6 bg-gray-50 rounded-xl hidden">
      <h3 class="text-lg font-bold mb-4">📈 阈值估计结果</h3>
      <div id="thresholdResult" class="text-lg"></div>
      <canvas id="psychChart" class="w-full max-w-2xl mx-auto mt-4" height="300"></canvas>
    </div>

  <!-- 图表区域：所有图表宽度一致，自适应 -->
  <div class="space-y-6 mb-8">
    <div id="trendChartContainer" class="bg-gray-50 p-4 rounded-xl hidden">
      <h3 class="text-lg font-bold mb-4">📈 正确率趋势</h3>
      <div class="w-full" style="position:relative; height:280px;">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
    <div id="heatmapContainer" class="bg-gray-50 p-4 rounded-xl hidden">
      <h3 class="text-lg font-bold mb-4">🔥 正确率热力图</h3>
      <div class="w-full" style="position:relative; height:320px;">
        <canvas id="heatmapChart"></canvas>
      </div>
    </div>
    <div id="areaChartContainer" class="bg-gray-50 p-4 rounded-xl hidden">
      <h3 class="text-lg font-bold mb-4">📊 单/双说话人正确率</h3>
      <div class="w-full" style="position:relative; height:280px;">
        <canvas id="areaChart"></canvas>
      </div>
    </div>
    <!-- 心理测量函数图 -->
    <div id="thresholdContainer" class="mb-8 p-6 bg-gray-50 rounded-xl hidden">
      <h3 class="text-lg font-bold mb-4">📈 阈值估计结果</h3>
      <div id="thresholdResult" class="text-lg mb-4"></div>
      <div class="w-full" style="position:relative; height:320px;">
        <canvas id="psychChart"></canvas>
      </div>
    </div>
  </div>

    <!-- 试次明细表格 -->
    <div class="mb-8">
      <h3 class="text-lg font-bold mb-4">📋 试次明细</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead id="resTableHead" class="bg-gray-100"></thead>
          <tbody id="resTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 返回按钮 -->
    <div class="text-center">
      <button onclick="goBack()" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-xl hover:bg-gray-300">
        ← 返回历史记录
      </button>
    </div>
  </div>
</div>

<!-- JS加载 -->
<script src="config/constants.js"></script>
<script src="js/uiHelper.js"></script>
<script src="js/core/Staircase.js"></script>
<script src="js/core/EventLogger.js"></script>
<script src="js/audioProcessor.js"></script>
<script src="js/psychometric.js"></script>
<script src="js/dataManager.js"></script>
<script src="js/charts.js"></script>
<script src="modules/module1.js"></script>
<script src="modules/module2.js"></script>
<script src="modules/module3.js"></script>
<script src="modules/module4.js"></script>
<script src="js/app.js"></script>

<script>
  // ==================== 图表自适应 ====================
  let chartResizeObserver = null;

  function setupChartResponsive() {
    // 使用 ResizeObserver 监听容器大小变化
    if (typeof ResizeObserver !== 'undefined') {
      chartResizeObserver = new ResizeObserver(() => {
        // 延迟执行，避免频繁重绘
        clearTimeout(setupChartResponsive._timer);
        setupChartResponsive._timer = setTimeout(() => {
          redrawAllCharts();
        }, 200);
      });

      // 观察所有图表容器
      ['trendChart', 'heatmapChart', 'areaChart', 'psychChart'].forEach(id => {
        const canvas = document.getElementById(id);
        if (canvas && canvas.parentElement) {
          chartResizeObserver.observe(canvas.parentElement);
        }
      });
    }

    // 初始绘制
    setTimeout(() => redrawAllCharts(), 100);
  }

  let _lastChartData = null; // 保存图表数据用于重绘

  function redrawAllCharts() {
    if (!_lastChartData) return;
    const { results, func, data } = _lastChartData;
    // 重新准备 canvas 尺寸
    ['trendChart', 'heatmapChart', 'areaChart', 'psychChart'].forEach(id => {
      prepareCanvas(id);
    });
    renderCharts(results, func, data);
  }

  // ==================== 页面初始化 ====================
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const viewResultId = urlParams.get('id');

    if (!viewResultId) {
      document.body.innerHTML = '<div class="text-center py-20 text-gray-400">未指定记录ID</div>';
      return;
    }

    if (typeof DataManager === 'undefined') {
      document.body.innerHTML = '<div class="text-center py-20 text-gray-400">系统加载失败</div>';
      return;
    }

    const data = DataManager.loadResultFromHistory(viewResultId);
    if (!data) {
      document.body.innerHTML = '<div class="text-center py-20 text-gray-400">未找到记录：' + viewResultId + '</div>';
      return;
    }

    // 渲染结果
    renderResultFromHistory(data);

    // 设置图表自适应
    setupChartResponsive();
  });

  // ==================== 渲染历史结果 ====================
  function renderResultFromHistory(data) {
    if (!data || !data.metadata || !data.results) {
      console.warn('[Result] 无效的数据');
      return;
    }

    const results = data.results;
    const metadata = data.metadata;
    const n = results.length;
    if (n === 0) return;

    const funcNames  = { 1:'功能一（抗干扰）', 2:'功能二（视觉整合）', 3:'功能三（异步校准）', 4:'功能四（注意定位）' };
    const phaseNames = { pre:'训练前测试', train:'训练阶段', post:'训练后测试' };

    // 更新摘要
    const corr = results.filter(r => r.correct).length;
    const accuracy = Math.round(corr / n * 100);

    const rAcc = document.getElementById('rAcc');
    if (rAcc) rAcc.textContent = accuracy + '%';

    const rTotal = document.getElementById('rTotal');
    if (rTotal) rTotal.textContent = n;

    const rSubject = document.getElementById('resSubject');
    if (rSubject) rSubject.textContent = metadata.subjectId || '--';

    const validRTs = results.filter(r => r.rt < 10000).map(r => r.rt);
    const avgRT = validRTs.length > 0 ? Math.round(validRTs.reduce((a,b)=>a+b,0)/validRTs.length) : 0;
    const rRT = document.getElementById('rRT');
    if (rRT) rRT.textContent = avgRT + 'ms';

    // 子标题
    const resSubtitle = document.getElementById('resSubtitle');
    if (resSubtitle) resSubtitle.textContent = `${funcNames[metadata.func] || '未知功能'} · ${phaseNames[metadata.phase] || metadata.phase}`;

    // 鼓励语
    const msg = document.getElementById('encourageMsg');
    if (msg) {
      const phaseMsg = {
        pre:   '基线测试完成，请告知工作人员，准备开始训练。',
        train: `训练完成！您的正确率是 ${accuracy}%，继续加油！`,
        post:  `后测完成，正确率 ${accuracy}%。请告知工作人员查看您的进步情况。`
      };
      msg.querySelector('div').textContent = phaseMsg[metadata.phase] || '本次训练已完成，请告知工作人员。';
    }

    // 渲染表格
    renderResultsTable(results, metadata.func);

    // 渲染阈值
    renderThreshold(data);

    // 渲染图表
    renderCharts(results, metadata.func, data);
  }

  function renderResultsTable(results, func) {
    const thead = document.getElementById('resTableHead');
    const tbody = document.getElementById('resTableBody');
    if (!tbody) return;

    // 表头
    if (thead) {
      let headHTML = '<tr>';
      headHTML += '<th class="p-2 text-left">#</th>';
      headHTML += '<th class="p-2 text-left">SNR(dB)</th>';
      if (func === 2 || func === 3) headHTML += '<th class="p-2 text-left">模糊</th>';
      if (func === 3) headHTML += '<th class="p-2 text-left">SOA</th>';
      if (func === 4) headHTML += '<th class="p-2 text-left">条件</th>';
      headHTML += '<th class="p-2 text-left">选择</th>';
      headHTML += '<th class="p-2 text-left">正确</th>';
      headHTML += '<th class="p-2 text-left">反应时</th>';
      headHTML += '</tr>';
      thead.innerHTML = headHTML;
    }

    // 表格内容
    let html = '';
    results.forEach((r, i) => {
      const choiceLabels = ['A','B','C','D'];
      html += `<tr class="border-t hover:bg-gray-50">
        <td class="p-2">${i+1}</td>
        <td class="p-2">${r.snr} dB</td>`;
      if (func === 2 || func === 3) html += `<td class="p-2">${r.blur}%</td>`;
      if (func === 3) html += `<td class="p-2">${r.soa} ms</td>`;
      if (func === 4) html += `<td class="p-2">${r.attention === 'single' ? '单' : '双'}</td>`;
      html += `<td class="p-2">${choiceLabels[r.choice] || '--'}</td>`;
      html += `<td class="p-2 ${r.correct ? 'text-green-600' : 'text-red-600'}">${r.correct ? '✓' : '✗'}</td>`;
      html += `<td class="p-2">${r.rt < 10000 ? r.rt + 'ms' : '--'}</td>`;
      html += '</tr>';
    });
    tbody.innerHTML = html;
  }

  function renderThreshold(data) {
    const container = document.getElementById('thresholdContainer');
    const result = document.getElementById('thresholdResult');
    if (!container || !result) return;

    const metadata = data.metadata;
    if (!metadata.threshold && !data.psychometricFit) {
      container.classList.add('hidden');
      return;
    }

    container.classList.remove('hidden');

    const funcNames = { 1: '阈值 SNR', 2: '视觉增益', 3: '整合窗口', 4: '干扰抑制成本' };
    const unit = { 1: 'dB', 2: '%', 3: 'ms', 4: 'dB' };

    let html = '';
    if (metadata.threshold !== null && metadata.threshold !== undefined) {
      html += `<div class="mb-2">${funcNames[metadata.func] || '阈值'}：<strong class="text-xl text-blue-600">${metadata.threshold}${unit[metadata.func] || ''}</strong></div>`;
    }
    if (metadata.accuracy) {
      html += `<div>正确率：<strong>${metadata.accuracy}%</strong></div>`;
    }
    result.innerHTML = html;

    // 绘制心理测量函数图
    const canvas = document.getElementById('psychChart');
    if (canvas && data.psychometricFit && typeof Charts !== 'undefined') {
      try {
        if (metadata.func === 1 && data.psychometricFit.fit) {
          Charts.drawPsychometric(canvas, data.psychometricFit.fit, data.psychometricFit.data, {
            title: '功能一：噪音阈值拟合图',
            xLabel: 'SNR (dB)',
            yLabel: '正确率',
            thresholdLine: 0.75, // Y=0.75 阈值线
            lineColor: '#6366f1'
          });
        } else if (metadata.func === 2 && data.psychometricFit.fitClear && data.psychometricFit.fitBlur) {
          Charts.drawDualPsychometric(canvas, data.psychometricFit.fitClear, data.psychometricFit.fitBlur, {
            label1: '清晰语音', label2: '模糊语音',
            title: '功能二：模糊度/视觉增益对比图'
          });
        } else if (metadata.func === 3 && data.psychometricFit.fit) {
          Charts.drawIntegrationWindow(canvas, data.psychometricFit.fit, {
            title: '功能三：SOA 多感官整合时窗',
            lowerSOA: data.psychometricFit.lowerSOA,
            upperSOA: data.psychometricFit.upperSOA,
            window: data.psychometricFit.window
          });
        } else if (metadata.func === 4 && data.psychometricFit.fitSingle && data.psychometricFit.fitDual) {
          Charts.drawInterferenceCost(canvas, data.psychometricFit.fitSingle, data.psychometricFit.fitDual, {
            cost: data.psychometricFit.cost,
            title: '功能四：双人注意干扰抑制成本'
          });
        }
        container.style.display = 'block';
      } catch(e) {
        console.warn('[Result] 心理测量图绘制失败:', e);
      }
    }
  }

  function prepareCanvas(id) {
    const canvas = document.getElementById(id);
    if (!canvas) return null;
    const parent = canvas.parentElement;
    if (!parent) return canvas;
    const rect = parent.getBoundingClientRect();
    const W = Math.floor(rect.width) || 600;
    const H = Math.floor(rect.height) || 280;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    return canvas;
  }

  function renderCharts(results, func, data) {
    if (typeof Charts === 'undefined') return;

    // 保存数据用于重绘
    _lastChartData = { results, func, data };

    // 准备 canvas 尺寸
    prepareCanvas('trendChart');
    prepareCanvas('heatmapChart');
    prepareCanvas('areaChart');
    prepareCanvas('psychChart');

    // 趋势图
    const trendCanvas = document.getElementById('trendChart');
    const trendContainer = document.getElementById('trendChartContainer');
    if (trendCanvas && trendContainer && results.length > 5) {
      try {
        const windowSize = Math.max(5, Math.floor(results.length / 10));
        const points = [];
        for (let i = windowSize; i <= results.length; i++) {
          const slice = results.slice(i - windowSize, i);
          const acc = slice.filter(r => r.correct).length / slice.length;
          points.push({ x: i, y: acc });
        }
        Charts.drawTrendLine(trendCanvas, points, {
          title: '正确率趋势（滑动窗口）',
          xLabel: '试次',
          yLabel: '正确率'
        });
        trendContainer.classList.remove('hidden');
      } catch(e) {
        console.warn('[Result] 趋势图绘制失败:', e);
      }
    }

    // 热力图
    const heatmapCanvas = document.getElementById('heatmapChart');
    const heatmapContainer = document.getElementById('heatmapContainer');
    if (heatmapCanvas && heatmapContainer && (func === 2 || func === 3)) {
      try {
        if (func === 2) {
          const snrLevels = [...new Set(results.map(r => r.snr))].sort((a,b) => a-b);
          const blurLevels = [...new Set(results.map(r => r.blur))].sort((a,b) => a-b);
          if (snrLevels.length > 0 && blurLevels.length > 0) {
            const matrix = blurLevels.map(blur =>
              snrLevels.map(snr => {
                const hits = results.filter(r => r.snr === snr && r.blur === blur);
                return hits.length > 0 ? hits.filter(r => r.correct).length / hits.length : 0;
              })
            );
            Charts.drawHeatmap(heatmapCanvas, {
              matrix: matrix,
              xLabels: snrLevels.map(s => s + 'dB'),
              yLabels: blurLevels.map(b => b + '%')
            }, {
              title: '功能二：SNR × 模糊度 正确率热力图',
              xLabel: 'SNR (dB)',
              yLabel: '模糊度 (%)'
            });
            heatmapContainer.classList.remove('hidden');
          }
        } else if (func === 3) {
          const snrLevels = [...new Set(results.map(r => r.snr))].sort((a,b) => a-b);
          const soaLevels = [...new Set(results.map(r => r.soa))].sort((a,b) => a-b);
          if (snrLevels.length > 0 && soaLevels.length > 0) {
            const matrix = soaLevels.map(soa =>
              snrLevels.map(snr => {
                const hits = results.filter(r => r.snr === snr && r.soa === soa);
                return hits.length > 0 ? hits.filter(r => r.correct).length / hits.length : 0;
              })
            );
            Charts.drawHeatmap(heatmapCanvas, {
              matrix: matrix,
              xLabels: snrLevels.map(s => s + 'dB'),
              yLabels: soaLevels.map(s => s + 'ms')
            }, {
              title: '功能三：SNR × SOA 正确率热力图',
              xLabel: 'SNR (dB)',
              yLabel: 'SOA (ms)'
            });
            heatmapContainer.classList.remove('hidden');
          }
        }
      } catch(e) {
        console.warn('[Result] 热力图绘制失败:', e);
      }
    }

    // 面积图（功能四）
    const areaCanvas = document.getElementById('areaChart');
    const areaContainer = document.getElementById('areaChartContainer');
    if (areaCanvas && areaContainer && func === 4) {
      try {
        const snrLevels = [...new Set(results.map(r => r.snr))].sort((a,b) => a-b);
        const singleData = { x: [], y: [] };
        const dualData = { x: [], y: [] };
        snrLevels.forEach(snr => {
          const singleHits = results.filter(r => r.snr === snr && r.attention === 'single');
          const dualHits = results.filter(r => r.snr === snr && r.attention === 'dual');
          singleData.x.push(snr);
          singleData.y.push(singleHits.length > 0 ? singleHits.filter(r => r.correct).length / singleHits.length : 0);
          dualData.x.push(snr);
          dualData.y.push(dualHits.length > 0 ? dualHits.filter(r => r.correct).length / dualHits.length : 0);
        });
        Charts.drawAreaChart(areaCanvas, { single: singleData, dual: dualData }, {
          label1: '单说话人', label2: '双说话人',
          title: '功能四：单/双说话人正确率对比'
        });
        areaContainer.classList.remove('hidden');
      } catch(e) {
        console.warn('[Result] 面积图绘制失败:', e);
      }
    }
  }

  // ==================== 工具函数 ====================
  function goBack() {
    window.location.href = 'history.html';
  }

  function printResult() {
    window.print();
  }
</script>

</body>
</html>
