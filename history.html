<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史记录 - 视听语音整合训练系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#2563eb',
            secondary: '#7c3aed',
            success: '#059669',
            warning: '#d97706',
            danger: '#dc2626',
          },
          fontSize: {
            'patient': ['1.25rem', { lineHeight: '1.8' }],
            'patient-lg': ['1.5rem', { lineHeight: '2' }],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { font-size: 17px; }
    .screen { display:block; }
    /* 折叠动画 */
    .subject-records { transition: max-height 0.3s ease; }
    .subject-records.collapsed { display: none; }
    /* 复选框样式 */
    input[type="checkbox"] { cursor: pointer; }
    /* 上传进度条 */
    .upload-progress { transition: width 0.3s ease; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- ================================================================
  历史记录页面（独立页面）
================================================================ -->
<div class="container mx-auto px-4 py-6 max-w-6xl">
  <div class="bg-white rounded-2xl shadow-xl p-8">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold text-gray-800">📂 历史记录</h2>
      <div class="flex gap-3 flex-wrap">
        <button onclick="DataManager.selectAll()" id="btnSelectAll" class="px-4 py-2 bg-teal-500 text-white rounded-lg hover:bg-teal-600 transition-colors text-sm">全选</button>
        <button onclick="DataManager.batchDelete()" class="px-4 py-2 bg-rose-500 text-white rounded-lg hover:bg-rose-600 transition-colors text-sm">批量删除</button>
        <button onclick="DataManager.uploadSelected()" class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors text-sm">上传到服务器</button>
        <button onclick="DataManager.exportSelectedWithFormat()" class="px-4 py-2 bg-slate-500 text-white rounded-lg hover:bg-slate-600 transition-colors text-sm">导出选中记录</button>
        <button onclick="DataManager.exportSubjectInfoCSV()" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors text-sm">导出被试信息</button>
        <a href="index.html" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 text-sm">← 返回首页</a>
      </div>
    </div>

    <!-- 存储使用量 -->
    <div id="storageInfo" class="mb-4 p-3 rounded-lg bg-gray-50 text-sm">
      <div class="flex items-center justify-between mb-1">
        <span>本地存储使用量</span>
        <span id="storagePercent" class="font-bold">--</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2">
        <div id="storageBar" class="bg-blue-500 h-2 rounded-full" style="width: 0%"></div>
      </div>
    </div>

    <!-- 上传状态提示 -->
    <div id="uploadStatus" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

    <div id="historyContent" class="text-center py-8 text-gray-400">暂无历史记录</div>
  </div>
</div>


<!-- JS加载 -->
<script src="config/constants.js"></script>
<script src="js/uiHelper.js"></script>
<script src="js/core/Staircase.js"></script>
<script src="js/core/EventLogger.js"></script>
<script src="js/audioProcessor.js"></script>
<script src="js/psychometric.js"></script>
<script src="js/dataManager.js"></script>
<script src="js/adaptiveEngine.js"></script>
<script src="modules/module1.js"></script>
<script src="modules/module2.js"></script>
<script src="modules/module3.js"></script>
<script src="modules/module4.js"></script>
<script src="js/app.js"></script>

<script>
  // 更新存储使用量显示
  function updateStorageInfo() {
    try {
      const data = localStorage.getItem('audioVisualTrainingData') || '';
      const bytes = new Blob([data]).size;
      const mb = bytes / (1024 * 1024);
      const percent = Math.min((bytes / (4 * 1024 * 1024)) * 100, 100).toFixed(1);

      const percentEl = document.getElementById('storagePercent');
      const barEl = document.getElementById('storageBar');
      const infoEl = document.getElementById('storageInfo');

      if (percentEl) percentEl.textContent = `${percent}% (${mb.toFixed(2)} MB / 4 MB)`;
      if (barEl) barEl.style.width = `${percent}%`;

      // 颜色警示
      if (parseFloat(percent) > 90) {
        if (barEl) barEl.className = 'bg-red-500 h-2 rounded-full';
        if (infoEl) infoEl.className = 'mb-4 p-3 rounded-lg bg-red-50 text-sm border border-red-200';
      } else if (parseFloat(percent) > 70) {
        if (barEl) barEl.className = 'bg-yellow-500 h-2 rounded-full';
        if (infoEl) infoEl.className = 'mb-4 p-3 rounded-lg bg-yellow-50 text-sm border border-yellow-200';
      } else {
        if (barEl) barEl.className = 'bg-blue-500 h-2 rounded-full';
        if (infoEl) infoEl.className = 'mb-4 p-3 rounded-lg bg-gray-50 text-sm';
      }
    } catch (e) {
      console.error('[StorageInfo] 更新失败:', e);
    }
  }

  // 页面加载时先从服务端加载数据，再渲染历史记录
  window.addEventListener('DOMContentLoaded', async () => {
    // 只有当本地没有数据时才从服务器加载
    const localData = localStorage.getItem('audioVisualTrainingData');
    if (!localData || localData === '[]' || JSON.parse(localData || '[]').length === 0) {
      if (typeof DataManager !== 'undefined' && DataManager.loadData) {
        await DataManager.loadData();
      }
    }
    setTimeout(() => {
      const hc = document.getElementById('historyContent');
      if (hc && typeof DataManager !== 'undefined') {
        hc.innerHTML = DataManager.generateHistoryHTML();
        renderAllHistoryCharts();
      }
      updateStorageInfo();
    }, 300);
  });

  // ==================== 历史成绩折线图（每被试一张） ====================
  // 暴露给 dataManager 在 status 切换后重绘
  window._historyChartInstances = {};

  window.renderAllHistoryCharts = function () {
    if (typeof DataManager === 'undefined' || typeof echarts === 'undefined') return;
    const allData = DataManager.getAllData();

    // 按被试分组
    const grouped = {};
    allData.forEach(d => {
      const sid = d.metadata.subjectId;
      if (!grouped[sid]) grouped[sid] = [];
      grouped[sid].push(d);
    });

    Object.keys(grouped).forEach(sid => {
      renderSubjectHistoryChart(sid, grouped[sid]);
    });
  };

  function renderSubjectHistoryChart(subjectId, records) {
    const dom = document.getElementById('historyChart_' + subjectId);
    if (!dom) return;

    // 销毁旧实例
    if (window._historyChartInstances[subjectId]) {
      window._historyChartInstances[subjectId].dispose();
    }
    const chart = echarts.init(dom);
    window._historyChartInstances[subjectId] = chart;

    // 只取 active 的记录（被标记 overwritten 的不显示）
    const visibleRecords = records.filter(d => d.status === 'active' || !d.status);

    // 按功能分组
    const funcColors = { 1: '#3b82f6', 2: '#a855f7', 3: '#f59e0b', 4: '#ef4444' };
    const funcNames  = { 1: '功能一（抗干扰）', 2: '功能二（视觉整合）', 3: '功能三（异步校准）', 4: '功能四（注意定位）' };
    const funcUnits  = { 1: 'dB', 2: 'dB', 3: 'ms', 4: 'dB' };

    const seriesData = {};
    [1, 2, 3, 4].forEach(f => { seriesData[f] = []; });

    visibleRecords
      .filter(d => d.metadata && d.metadata.threshold != null && typeof d.metadata.threshold === 'number')
      .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp))
      .forEach(d => {
        const f = d.metadata.func;
        if (!seriesData[f]) seriesData[f] = [];
        seriesData[f].push({
          value: [d.timestamp, +d.metadata.threshold.toFixed(2)],
          attempt: d.attemptNumber || 1,
          phase: d.metadata.phase
        });
      });

    const seriesList = [];
    [1, 2, 3, 4].forEach(f => {
      if (seriesData[f].length > 0) {
        seriesList.push({
          name: funcNames[f],
          type: 'line',
          data: seriesData[f],
          smooth: true,
          symbol: 'circle',
          symbolSize: 8,
          lineStyle: { color: funcColors[f], width: 2 },
          itemStyle: { color: funcColors[f] }
        });
      }
    });

    if (seriesList.length === 0) {
      chart.setOption({
        title: {
          text: '暂无可显示的成绩数据',
          left: 'center', top: 'middle',
          textStyle: { color: '#9ca3af', fontSize: 14, fontWeight: 'normal' }
        }
      });
      return;
    }

    chart.setOption({
      tooltip: {
        trigger: 'axis',
        formatter: (params) => {
          const lines = [params[0].axisValueLabel];
          params.forEach(p => {
            const funcIdx = ['功能一（抗干扰）','功能二（视觉整合）','功能三（异步校准）','功能四（注意定位）'].indexOf(p.seriesName) + 1;
            const unit = funcUnits[funcIdx] || '';
            const extra = p.data.attempt != null ? ` (#${p.data.attempt})` : '';
            lines.push(`${p.marker} ${p.seriesName}：<b>${p.value[1]} ${unit}</b>${extra}`);
          });
          return lines.join('<br/>');
        }
      },
      legend: { top: 4, type: 'scroll' },
      grid: { left: 50, right: 20, top: 40, bottom: 40 },
      xAxis: {
        type: 'time',
        axisLabel: { fontSize: 11 }
      },
      yAxis: {
        type: 'value',
        name: '阈值 / 指标',
        nameTextStyle: { fontSize: 11 },
        axisLabel: { fontSize: 11 }
      },
      series: seriesList
    });

    // 监听容器尺寸（折叠展开时）
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(() => chart.resize());
      ro.observe(dom);
    }
  }

  // 全局窗口变化时重绘
  window.addEventListener('resize', () => {
    Object.values(window._historyChartInstances || {}).forEach(c => c && c.resize());
  });
</script>

</body>
</html>
