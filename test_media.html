<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>音频诊断页</title></head>
<body style="font-family:sans-serif;padding:40px;background:#1a1a2e;color:#eee;">
<h2>🔊 音频播放诊断</h2>
<p>逐个点击按钮测试，观察哪个能播放：</p>

<div style="margin:20px 0;">
  <button onclick="testAudio('assets/audio/white_noise.wav')" style="padding:10px 20px;margin:5px;font-size:16px;">测试 white_noise.wav</button>
  <button onclick="testAudio('assets/audio/M8_ba_A.mp4')" style="padding:10px 20px;margin:5px;font-size:16px;">测试 M8_ba_A.mp4</button>
  <button onclick="testVideo('assets/audio/M8_ba_A.mp4')" style="padding:10px 20px;margin:5px;font-size:16px;">用VIDEO元素测试 M8_ba_A.mp4</button>
</div>

<div id="log" style="background:#000;padding:15px;border-radius:8px;font-family:monospace;white-space:pre-wrap;max-height:400px;overflow-y:auto;"></div>

<script>
function log(msg) {
  const d = document.getElementById('log');
  d.textContent += new Date().toLocaleTimeString() + ' ' + msg + '\n';
  d.scrollTop = d.scrollHeight;
}

async function testAudio(src) {
  log('🎵 创建 &lt;audio&gt; 元素，src=' + src);
  const a = new Audio(src);
  a.controls = true;
  document.getElementById('log').parentNode.appendChild(a);
  
  a.addEventListener('canplay', () => log('✅ canplay 事件触发'));
  a.addEventListener('error', () => {
    const e = a.error;
    log('❌ 错误: code=' + (e?e.code:'?') + ' message=' + (e?e.message:'?'));
    log('   readyState=' + a.readyState + ' networkState=' + a.networkState);
  });
  a.addEventListener('playing', () => log('▶️ 开始播放'));
  
  try {
    await a.play();
    log('✅ play() 成功');
  } catch(err) {
    log('❌ play() 失败: ' + err.message);
  }
}

function testVideo(src) {
  log('🎬 创建 &lt;video&gt; 元素，src=' + src);
  const v = document.createElement('video');
  v.src = src;
  v.controls = true;
  v.style.display = 'block';
  v.style.margin = '10px 0';
  document.getElementById('log').parentNode.appendChild(v);
  
  v.addEventListener('error', () => {
    const e = v.error;
    log('❌ VIDEO错误: code=' + (e?e.code:'?') + ' message=' + (e?e.message:'?'));
  });
  v.addEventListener('canplay', () => log('✅ VIDEO canplay'));
  v.play().then(() => log('✅ VIDEO play() 成功')).catch(e => log('❌ VIDEO play() 失败: ' + e.message));
}
</script>
</body>
</html>
