<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音频混合调试工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; }
    .log { background: #f5f5f5; padding: 10px; border-radius: 5px; height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    .log-entry { margin: 2px 0; padding: 2px 5px; border-left: 3px solid #ccc; }
    .log-error { border-left-color: #ef4444; color: #dc2626; }
    .log-warn { border-left-color: #f59e0b; color: #d97706; }
    .log-info { border-left-color: #3b82f6; color: #2563eb; }
  </style>
</head>
<body>
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">🔧 音频混合调试工具</h1>
    
    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
      <p class="font-bold">使用说明：</p>
      <p>1. 打开浏览器控制台（F12）查看详细日志</p>
      <p>2. 点击下方按钮测试不同播放模式</p>
      <p>3. 观察是否正常听到信号音（语音）</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div class="border rounded-lg p-4">
        <h2 class="text-lg font-bold mb-2">测试 1: 仅播放噪音</h2>
        <p class="text-sm text-gray-600 mb-2">测试噪音播放是否正常</p>
        <button onclick="testNoiseOnly()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
          播放噪音 (SNR=6dB)
        </button>
      </div>

      <div class="border rounded-lg p-4">
        <h2 class="text-lg font-bold mb-2">测试 2: 仅播放信号</h2>
        <p class="text-sm text-gray-600 mb-2">测试信号音播放是否正常</p>
        <button onclick="testSignalOnly()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">
          播放信号音
        </button>
      </div>

      <div class="border rounded-lg p-4">
        <h2 class="text-lg font-bold mb-2">测试 3: 混合播放 (SNR=6dB)</h2>
        <p class="text-sm text-gray-600 mb-2">噪音应该较小，信号清晰</p>
        <button onclick="testMixed(6)" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded">
          混合播放 SNR=6dB
        </button>
      </div>

      <div class="border rounded-lg p-4">
        <h2 class="text-lg font-bold mb-2">测试 4: 混合播放 (SNR=0dB)</h2>
        <p class="text-sm text-gray-600 mb-2">噪音和信号音量相等</p>
        <button onclick="testMixed(0)" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded">
          混合播放 SNR=0dB
        </button>
      </div>

      <div class="border rounded-lg p-4">
        <h2 class="text-lg font-bold mb-2">测试 5: 混合播放 (SNR=-6dB)</h2>
        <p class="text-sm text-gray-600 mb-2">噪音应该较大，信号较难听清</p>
        <button onclick="testMixed(-6)" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">
          混合播放 SNR=-6dB
        </button>
      </div>

      <div class="border rounded-lg p-4">
        <h2 class="text-lg font-bold mb-2">停止播放</h2>
        <p class="text-sm text-gray-600 mb-2">停止所有音频</p>
        <button onclick="stopAll()" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded">
          停止
        </button>
      </div>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-bold mb-2">选择测试音频文件:</label>
      <select id="audioSelect" class="border rounded px-3 py-2 w-full">
        <option value="assets/audio/M8_ba_A.mp4">M8_ba_A.mp4</option>
        <option value="assets/audio/M8_da_A.mp4">M8_da_A.mp4</option>
        <option value="assets/audio/M8_ga_A.mp4">M8_ga_A.mp4</option>
      </select>
    </div>

    <div class="mb-4">
      <h2 class="text-lg font-bold mb-2">调试日志</h2>
      <div id="log" class="log"></div>
    </div>
  </div>

  <script>
    // 简单日志记录
    const logDiv = document.getElementById('log');
    function addLog(msg, type = 'info') {
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(`[Debug] ${msg}`);
    }

    // 音频处理变量
    let audioContext = null;
    let noiseBuffer = null;
    let noiseSource = null;
    let noiseGainNode = null;
    let signalGainNode = null;
    let masterGainNode = null;
    let taskAudioElement = null;
    let taskAudioSourceNode = null;

    // 初始化音频上下文
    async function initAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        masterGainNode = audioContext.createGain();
        masterGainNode.gain.value = 1.0;
        masterGainNode.connect(audioContext.destination);
        
        signalGainNode = audioContext.createGain();
        signalGainNode.gain.value = 0.5;
        signalGainNode.connect(masterGainNode);
      }
      
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }
      
      return audioContext;
    }

    // 加载噪音
    async function loadNoise() {
      if (noiseBuffer) return noiseBuffer;
      
      addLog('加载噪音文件...', 'info');
      try {
        const response = await fetch('assets/audio/white_noise.wav');
        addLog(`噪音文件响应: ${response.status} ${response.statusText}`, response.ok ? 'info' : 'error');
        
        if (response.ok) {
          const arrayBuffer = await response.arrayBuffer();
          noiseBuffer = await audioContext.decodeAudioData(arrayBuffer);
          addLog('✓ 噪音文件加载成功', 'info');
          return noiseBuffer;
        }
      } catch (error) {
        addLog(`✗ 噪音文件加载失败: ${error.message}`, 'error');
      }
      
      addLog('使用合成噪音', 'warn');
      noiseBuffer = createSyntheticNoise();
      return noiseBuffer;
    }

    // 合成噪音
    function createSyntheticNoise() {
      const sampleRate = audioContext.sampleRate;
      const length = sampleRate * 4;
      const buffer = audioContext.createBuffer(1, length, sampleRate);
      const data = buffer.getChannelData(0);
      
      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.5;
      }
      
      return buffer;
    }

    // 启动噪音
    function startNoise() {
      stopNoiseSource();
      
      noiseSource = audioContext.createBufferSource();
      noiseSource.buffer = noiseBuffer;
      noiseSource.loop = true;
      
      noiseGainNode = audioContext.createGain();
      noiseGainNode.gain.setValueAtTime(0, audioContext.currentTime);
      noiseSource.connect(noiseGainNode);
      noiseGainNode.connect(masterGainNode);
      
      noiseSource.start();
      addLog('✓ 噪音已启动', 'info');
    }

    // 设置噪音电平
    function setNoiseLevel(snr) {
      if (!noiseGainNode) {
        addLog('✗ noiseGainNode 未初始化', 'error');
        return;
      }
      
      const sigGain = 0.5;
      const noiseGainValue = sigGain * Math.pow(10, -snr / 20);
      const clamped = Math.min(noiseGainValue, sigGain * 3.0);
      
      addLog(`设置噪音电平: SNR=${snr}dB, 噪音增益=${clamped.toFixed(4)}`, 'info');
      
      const now = audioContext.currentTime;
      noiseGainNode.gain.cancelScheduledValues(now);
      noiseGainNode.gain.setValueAtTime(noiseGainNode.gain.value, now);
      noiseGainNode.gain.exponentialRampToValueAtTime(Math.max(0.0001, clamped), now + 0.02);
    }

    // 停止噪音
    function stopNoiseSource() {
      if (noiseSource) {
        try { noiseSource.stop(); } catch (e) {}
        noiseSource.disconnect();
        noiseSource = null;
      }
      if (noiseGainNode) {
        noiseGainNode.disconnect();
        noiseGainNode = null;
      }
    }

    // 播放任务音频文件
    function playTaskAudioFile(audioPath) {
      return new Promise((resolve, reject) => {
        addLog(`开始加载音频: ${audioPath}`, 'info');
        
        if (!taskAudioElement) {
          taskAudioElement = document.createElement('audio');
          taskAudioElement.style.display = 'none';
          document.body.appendChild(taskAudioElement);
          
          taskAudioSourceNode = audioContext.createMediaElementSource(taskAudioElement);
          taskAudioSourceNode.connect(signalGainNode);
          addLog('✓ 音频元素和源节点已创建', 'info');
        }
        
        let resolved = false;
        
        taskAudioElement.onerror = function(e) {
          addLog(`✗ 音频加载失败: ${audioPath}`, 'error');
          if (!resolved) {
            resolved = true;
            reject(new Error('音频加载失败'));
          }
        };
        
        taskAudioElement.oncanplaythrough = function() {
          addLog('✓ 音频准备就绪，开始播放', 'info');
          taskAudioElement.play().catch(err => {
            addLog(`✗ 播放失败: ${err.message}`, 'error');
            if (!resolved) {
              resolved = true;
              reject(err);
            }
          });
        };
        
        taskAudioElement.onended = function() {
          addLog('✓ 音频播放结束 (onended)', 'info');
          if (!resolved) {
            resolved = true;
            resolve();
          }
        };
        
        taskAudioElement.src = audioPath;
        taskAudioElement.load();
        addLog(`已设置 src: ${audioPath}`, 'info');
      });
    }

    // 测试函数
    async function testNoiseOnly() {
      addLog('=== 测试1: 仅播放噪音 ===', 'info');
      try {
        await initAudioContext();
        await loadNoise();
        startNoise();
        setNoiseLevel(6);
        addLog('噪音播放中... (3秒后自动停止)', 'info');
        setTimeout(() => {
          stopNoiseSource();
          addLog('✓ 噪音已停止', 'info');
        }, 3000);
      } catch (error) {
        addLog(`✗ 错误: ${error.message}`, 'error');
      }
    }

    async function testSignalOnly() {
      addLog('=== 测试2: 仅播放信号 ===', 'info');
      try {
        await initAudioContext();
        const audioPath = document.getElementById('audioSelect').value;
        await playTaskAudioFile(audioPath);
        addLog('✓ 信号播放完成', 'info');
      } catch (error) {
        addLog(`✗ 错误: ${error.message}`, 'error');
      }
    }

    async function testMixed(snr) {
      addLog(`=== 测试3: 混合播放 SNR=${snr}dB ===`, 'info');
      try {
        await initAudioContext();
        await loadNoise();
        startNoise();
        setNoiseLevel(snr);
        addLog(`噪音已启动, SNR=${snr}dB`, 'info');
        
        const audioPath = document.getElementById('audioSelect').value;
        addLog(`开始播放信号: ${audioPath}`, 'info');
        await playTaskAudioFile(audioPath);
        addLog('✓ 混合播放完成', 'info');
        
        // 停止噪音
        if (noiseGainNode) {
          noiseGainNode.gain.setTargetAtTime(0, audioContext.currentTime, 0.08);
          setTimeout(() => stopNoiseSource(), 500);
        }
      } catch (error) {
        addLog(`✗ 错误: ${error.message}`, 'error');
      }
    }

    function stopAll() {
      addLog('停止所有音频', 'warn');
      stopNoiseSource();
      if (taskAudioElement) {
        taskAudioElement.pause();
        taskAudioElement.currentTime = 0;
      }
    }

    addLog('调试工具已就绪', 'info');
  </script>
</body>
</html>
